<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Blog preview card</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>
    <article class="card">
      <div class="card-image">
        <img src="./assets/images/illustration-article.svg" alt="">
      </div>
      <div class="card-body">
        <p class="category">Learning</p>
        <p class="data">Published 21 Dec 2023</p>
        <h1>HTML &amp; CSS foundations</h1>
        <p class="info">These languages are the backbone of every website, defining structure, content, and
          presentation.</p>
      </div>
      <div class="card-footer">
        <div class="logo">
          <img src="./assets/images/image-avatar.webp" alt="">
        </div>
        <span>Greg Hooper</span>
      </div>
    </article>
  </main>

  <footer class="attribution d-flex justify-content-center">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by &nbsp;<a href="https://github.com/BrayanDaga">Brayan Marino Vilchez Daga</a>.
  </footer>
</body>

</html>
